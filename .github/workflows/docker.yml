name: docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # Only image inputs trigger a publish (docs/.githooks/renovate.json etc. do not).
    # Path filters are not applied to tag pushes, so v*.*.* tags always build.
    # docker is not a required check (rulesets 2026-11-02 require ci/quality/CodeQL only), so a workflow-level filter is safe.
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - tailwind.config.ts
      - postcss.config.js
      - drizzle.config.ts
      - src/**
      - frontend/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: derpsen/magguu-bot

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # no npm cache in the publishing workflow (cache-poisoning guard)
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # Order matters (2026-11-02, same as MagguuUI-Website 496fc99): the build pushes ONLY the immutable
      # sha-<short> tag. The floating tags (latest, semver) are set by "Publish floating tags" after cosign sign
      # + attestation on the digest, so the Unraid auto-update gate never sees an unsigned :latest.
      - name: Extract metadata (all tags, published after signing)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Extract metadata (immutable sha tag for the build push)
        id: meta-sha
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-sha.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        env:
          IMG: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMG}@${DIGEST}"

      # GitHub build-provenance attestation, like MagguuUI-Website: stored in GitHub's attestation store AND pushed
      # to GHCR as an OCI referrer (push-to-registry, uses the existing packages: write). No storage record, so no
      # artifact-metadata permission. The BuildKit SBOM + provenance (sbom/provenance above) are already attached
      # to the image index. Verify: cosign verify ... / gh attestation verify oci://... (see AGENTS.md).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish floating tags (after signing, same digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMG: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMG}@${DIGEST}"
          echo "floating tags published at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag points to $got, expected $DIGEST"; exit 1; }
          done <<< "$TAGS"

      # Same identity the Unraid gate checks: this repo's docker.yml on the pushed ref (refs/heads/main or a v tag).
      - name: Verify signature via the floating tags
        env:
          IMG: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          ref_re=$(printf '%s' "$REF" | sed 's/[.]/\\./g')
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in "${IMG}:sha-"*) continue ;; esac
            cosign verify "$tag" \
              --certificate-identity-regexp "^https://github.com/${REPO}/\\.github/workflows/docker\\.yml@${ref_re}\$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "cosign verify ${tag}: OK"
          done <<< "$TAGS"

  alarm:
    name: failure alarm
    needs: [verify, build-and-push]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-alarm.yml
    secrets:
      ESCALATION_WEBHOOK_URL: ${{ secrets.ESCALATION_WEBHOOK_URL }}
      ESCALATION_BEARER: ${{ secrets.ESCALATION_BEARER }}
