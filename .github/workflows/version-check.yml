name: version-check

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-versions.mjs'
      - '.github/workflows/version-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      # Derpsen/MagguuUI is private: MAGGUUUI_READ_TOKEN (fine-grained, contents:read on
      # MagguuUI) is needed; without it the job only warns.
      - name: Check MagguuUI version mentions
        env:
          GITHUB_TOKEN: ${{ secrets.MAGGUUUI_READ_TOKEN || github.token }}
        run: node scripts/check-versions.mjs
